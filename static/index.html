<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Modern File Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-panel">
        <h1 id="app-title" style="margin-top: 0; color: #1f2937; user-select: none;">File Share</h1>
        <p style="color: #4b5563; margin-bottom: 25px;">ファイルをドラッグ＆ドロップまたはクリックしてアップロード</p>
        
        <form id="upload-form">
            <div class="drop-zone" id="drop-zone">
                <span id="file-name" style="color: #6b7280; font-weight: 500;">ファイルを選択またはドロップ</span>
                <input type="file" id="file-input" class="hidden" required>
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="font-size: 14px; color: #4b5563; font-weight: 500;">保存期間: </label>
                <select id="days-select" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: white;">
                    <option value="1">1日</option>
                    <option value="2" selected>2日 (デフォルト)</option>
                    <option value="3">3日</option>
                    <option value="7">7日</option>
                </select>
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">アップロードしてリンクを生成</button>
        </form>

        <div id="result" class="hidden" style="margin-top:25px; text-align: left; background: rgba(79,70,229,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(79,70,229,0.2);">
            <label style="font-size: 13px; font-weight: 600; color: #4f46e5;">共有リンク:</label>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
                <input type="text" id="download-link-input" readonly style="flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: white; font-size: 14px;" onclick="this.select();">
                <button onclick="copyLink()" class="btn" style="padding: 8px 14px; margin: 0; font-size: 14px;">コピー</button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if(fileInput.files.length > 0) fileName.textContent = fileInput.files[0].name;
        });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = fileInput.files[0].name;
            }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("days", document.getElementById('days-select').value);

            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            const resultDiv = document.getElementById('result');
            const linkInput = document.getElementById('download-link-input');
            linkInput.value = window.location.origin + data.url;
            resultDiv.classList.remove('hidden');
        });

        function copyLink() {
            const linkInput = document.getElementById('download-link-input');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value);
            alert("リンクをクリップボードにコピーしました！");
        }

        // 裏コマンド (タイトル3回クリックで永続化モード解禁)
        let clickCount = 0;
        document.getElementById('app-title').addEventListener('click', () => {
            clickCount++;
            if(clickCount === 3) {
                const select = document.getElementById('days-select');
                const opt = document.createElement('option');
                opt.value = "99";
                opt.textContent = "永続化 (無期限)";
                select.appendChild(opt);
                select.value = "99";
                alert("✨ 永続化モードが解放されました");
            }
        });
    </script>
</body>
</html>

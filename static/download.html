<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイルダウンロード - File Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-panel">
        <h2 style="color: #1f2937; margin-top: 0;">📥 ファイルダウンロード</h2>
        <div id="loading" style="color: #4b5563; margin: 30px 0;">ファイルを読み込んでいます...</div>
        
        <div id="file-info" class="hidden" style="text-align: left; background: white; padding: 20px; border-radius: 14px; margin: 20px 0; border: 1px solid #e5e7eb;">
            <p style="margin: 8px 0;"><strong>ファイル名:</strong> <span id="f-name" style="color: #4f46e5; word-break: break-all;"></span></p>
            <p style="margin: 8px 0;"><strong>ファイルサイズ:</strong> <span id="f-size" style="color: #4b5563;"></span></p>
            <p style="margin: 8px 0;"><strong>有効期限:</strong> <span id="f-expire" style="color: #4b5563;"></span></p>
        </div>

        <button id="download-btn" class="btn hidden" onclick="startDownload()" style="width: 100%;">ダウンロードする</button>
        <div id="error-msg" class="hidden" style="color: #ef4444; font-weight: 600; margin-top: 20px; background: rgba(239,68,68,0.1); padding: 12px; border-radius: 10px;"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        async function init() {
            if (!fileId) {
                showError("無効なリンクです。");
                return;
            }
            try {
                const res = await fetch(`/api/info/${fileId}`);
                if (!res.ok) throw new Error("ファイルが見つからないか、有効期限切れです。");
                const data = await res.json();

                document.getElementById('f-name').textContent = data.original_name;
                document.getElementById('f-size').textContent = formatBytes(data.size);
                document.getElementById('f-expire').textContent = data.expires_at === 'never' ? '無期限（永続）' : new Date(data.expires_at).toLocaleString();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('file-info').classList.remove('hidden');
                document.getElementById('download-btn').classList.remove('hidden');
            } catch (err) {
                showError(err.message);
            }
        }

        function startDownload() {
            window.location.href = `/api/download/${fileId}`;
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - File Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-panel">
        <h2 style="color: #1f2937; margin-top: 0;">🔐 管理者ログイン</h2>
        <p style="color: #4b5563; margin-bottom: 25px;">管理パスワードを入力してください</p>
        
        <input type="password" id="secret-key" class="input-field" placeholder="パスワードを入力">
        <br>
        <button onclick="handleLogin()" class="btn" style="width: 100%;">ログイン</button>
        <div id="login-error" style="color: #ef4444; margin-top: 15px; font-size: 14px; font-weight: 500;"></div>
    </div>

    <script>
        async function handleLogin() {
            const token = document.getElementById('secret-key').value;
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = "";

            try {
                const res = await fetch('/api/admin/verify?token=' + encodeURIComponent(token));
                if (res.status === 403) {
                    errDiv.textContent = "⚠️ パスワードが違います";
                    return;
                }
                if (!res.ok) throw new Error("通信エラーが発生しました");

                // トークンを sessionStorage に保存してダッシュボードへページ遷移
                sessionStorage.setItem('admin_token', token);
                window.location.href = '/dashboard.html';
            } catch (err) {
                errDiv.textContent = "⚠️ " + err.message;
            }
        }

        // Enterキーでログイン
        document.getElementById('secret-key').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
